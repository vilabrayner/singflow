name: singflow-local
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: singflow
      POSTGRES_USER: singflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U singflow -d singflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    image: singflow-backend:local
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/singflow
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_MARKET: ${SPOTIFY_MARKET:-BR}
      SINGFLOW_SPOTIFY_SEARCH_ENABLED: ${SINGFLOW_SPOTIFY_SEARCH_ENABLED:-true}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SINGFLOW_YOUTUBE_SEARCH_ENABLED: ${SINGFLOW_YOUTUBE_SEARCH_ENABLED:-true}
      YOUTUBE_SEARCH_LIMIT_PER_DAY: ${YOUTUBE_SEARCH_LIMIT_PER_DAY:-100}
      SINGFLOW_LYRICS_ENABLED: ${SINGFLOW_LYRICS_ENABLED:-true}
      SINGFLOW_LYRICS_PREFETCH_ENABLED: ${SINGFLOW_LYRICS_PREFETCH_ENABLED:-true}
      SINGFLOW_ENRICHMENT_ENABLED: ${SINGFLOW_ENRICHMENT_ENABLED:-true}
      SINGFLOW_ENRICHMENT_WORKER_ENABLED: ${SINGFLOW_ENRICHMENT_WORKER_ENABLED:-true}
      SINGFLOW_LYRICS_CLIENT: ${SINGFLOW_LYRICS_CLIENT:-SingFlow/0.1 (https://singflow.flowave.tec.br)}
      SINGFLOW_CIFRA_SEARCH_ENABLED: ${SINGFLOW_CIFRA_SEARCH_ENABLED:-true}
      SINGFLOW_ADMIN_EMAIL: ${SINGFLOW_ADMIN_EMAIL:-}
      SINGFLOW_SMTP_HOST: ${SINGFLOW_SMTP_HOST:-}
      SINGFLOW_SMTP_PORT: ${SINGFLOW_SMTP_PORT:-587}
      SINGFLOW_SMTP_USERNAME: ${SINGFLOW_SMTP_USERNAME:-}
      SINGFLOW_SMTP_PASSWORD: ${SINGFLOW_SMTP_PASSWORD:-}
      SINGFLOW_SMTP_AUTH: ${SINGFLOW_SMTP_AUTH:-true}
      SINGFLOW_SMTP_STARTTLS: ${SINGFLOW_SMTP_STARTTLS:-true}
      SINGFLOW_MAIL_FROM: ${SINGFLOW_MAIL_FROM:-}
      DB_USERNAME: singflow
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      SINGFLOW_ENTRY_LIMIT_PER_MINUTE: ${SINGFLOW_ENTRY_LIMIT_PER_MINUTE:-120}
      SINGFLOW_REQUEST_LIMIT_PER_MINUTE: ${SINGFLOW_REQUEST_LIMIT_PER_MINUTE:-20}
      SINGFLOW_READ_LIMIT_PER_MINUTE: ${SINGFLOW_READ_LIMIT_PER_MINUTE:-120}
      SINGFLOW_PUBLIC_APP_URL: ${SINGFLOW_PUBLIC_APP_URL:-http://127.0.0.1:${WEB_PORT:-8081}}
      SINGFLOW_HOST_EMAIL: ${SINGFLOW_HOST_EMAIL:?Defina SINGFLOW_HOST_EMAIL no .env}
      SINGFLOW_HOST_PASSWORD: ${SINGFLOW_HOST_PASSWORD:?Defina SINGFLOW_HOST_PASSWORD no .env}
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    image: singflow-frontend:local
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    volumes:
      - type: bind
        source: ./frontend/public/config.json
        target: /usr/share/nginx/html/config.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - backend
volumes:
  local-postgres:
