name: singflow-local
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: singflow
      POSTGRES_USER: singflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U singflow -d singflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    image: singflow-backend:local
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/singflow
      DB_USERNAME: singflow
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      SINGFLOW_HOST_EMAIL: ${SINGFLOW_HOST_EMAIL:?Defina SINGFLOW_HOST_EMAIL no .env}
      SINGFLOW_HOST_PASSWORD: ${SINGFLOW_HOST_PASSWORD:?Defina SINGFLOW_HOST_PASSWORD no .env}
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    image: singflow-frontend:local
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    volumes:
      - type: bind
        source: ./frontend/public/config.json
        target: /usr/share/nginx/html/config.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - backend
volumes:
  local-postgres:
