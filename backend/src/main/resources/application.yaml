spring:
  application:
    name: singflow
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
