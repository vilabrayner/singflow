spring:
  application:
    name: singflow
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/singflow}
    username: ${DB_USERNAME:singflow}
    password: ${DB_PASSWORD:singflow}
  mail:
    host: ${SINGFLOW_SMTP_HOST:}
    port: ${SINGFLOW_SMTP_PORT:587}
    username: ${SINGFLOW_SMTP_USERNAME:}
    password: ${SINGFLOW_SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SINGFLOW_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SINGFLOW_SMTP_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${SINGFLOW_SMTP_STARTTLS:true}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    default-schema: public
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
