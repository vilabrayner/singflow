# Local defaults match backend/compose.yaml and .env.example.
# Environment variables or IDE settings override these values.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/singflow}
    username: ${DB_USERNAME:singflow}
    password: ${DB_PASSWORD:singflow}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
