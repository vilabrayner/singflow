name: Frontend
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Interface test suite
        type: choice
        options: [release, full]
        default: release
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:config
      - run: npm run build
        env:
          PRIMEUI_LICENSE_KEY: ${{ secrets.PRIMEUI_LICENSE_KEY }}
      - run: npx playwright install --with-deps chromium
      - name: Critical release interface tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite != 'full' }}
        run: npm run test:release
        env:
          PRIMEUI_LICENSE_KEY: ${{ secrets.PRIMEUI_LICENSE_KEY }}
      - name: Full interface regression (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
        run: npm run test:full
        env:
          PRIMEUI_LICENSE_KEY: ${{ secrets.PRIMEUI_LICENSE_KEY }}
